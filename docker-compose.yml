services:
  # ── MCP server (memory + email) ────────────────────────────────────────────
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "7075:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # Gmail SMTP (optional). Set in project-root .env — loaded by Compose for ${...} substitution.
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-"Personal Agent"}
