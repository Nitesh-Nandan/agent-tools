services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: "-p 5455"
    environment:
      POSTGRES_DB: agent_memory
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent_secret # change in production
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5455:5455"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U agent -d agent_memory -p 5455" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── MCP server (memory + email) ────────────────────────────────────────────
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "7075:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5455
      DB_NAME: agent_memory
      DB_USER: agent
      DB_PASSWORD: agent_secret # match the db service above
      # Gmail SMTP (optional). Set in project-root .env — loaded by Compose for ${...} substitution.
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-"Personal Agent"}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
