[project]
name = "agent-tools"
version = "0.1.0"
description = "MCP agent tools: PostgreSQL memory + optional email (SMTP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "fastmcp>=3.1.1",
    "asyncpg>=0.30.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
agent-tools = "main:main"
